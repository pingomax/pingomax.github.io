<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxshop</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #555555;
      --card-bg: #f9fafb;
      --border: #e5e7eb;
      --link: #2563eb;
      --link-hover: #1d4ed8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 680px;
      width: 100%;
      margin: auto 0;
    }
    header {
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 1rem;
      color: #111827;
    }
    .description {
      font-size: 1.125rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .links-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .links-card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      color: #374151;
    }
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    li a {
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
    }
    li a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Maxshop</h1>
      <p class="description">Maxshop is a personal tool that lets creators publish and manage their own short videos on their TikTok account.</p>
    </header>
    <main>
      <div class="links-card">
        <h2>Legal Information</h2>
        <ul>
          <li><a href="terms.html">Terms of Service &rarr;</a></li>
          <li><a href="privacy.html">Privacy Policy &rarr;</a></li>
        </ul>
      </div>
    </main>
    <footer>
      <p>&copy; 2026 Maxshop. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
